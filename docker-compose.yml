version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: recare_postgres
    environment:
      POSTGRES_USER: recare_user
      POSTGRES_PASSWORD: recare_password
      POSTGRES_DB: recare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recare_user -d recare_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: recare_backend
    environment:
      DATABASE_URL: postgresql://recare_user:recare_password@db:5432/recare_db
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./backend/models:/app/backend/models

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recare_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
